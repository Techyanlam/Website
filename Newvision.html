<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>New Vision 維修發票打印工具</title>
<style>
*{box-sizing:border-box;font-family:"微軟正黑體","Microsoft JhengHei",sans-serif;}
body{background:#f7f7f7;margin:0;padding:20px;max-width:1200px;margin:0 auto;}
.box{background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 12px #00000012;margin-bottom:20px;}
h3{margin-top:0;color:#222;}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;margin:6px 0;}
input[readonly]{background:#f3f3f3;}
.btn-group{display:flex;gap:12px;margin-top:12px;}
button{padding:9px 16px;border:none;border-radius:5px;font-size:14px;cursor:pointer;}
.btn-blue{background:#0066cc;color:#fff;}
.btn-gray{background:#666;color:#fff;}
table{width:100%;border-collapse:collapse;margin:10px 0;}
th,td{border:1px solid #999;padding:8px 10px;}
.print-area{width:210mm;min-height:297mm;padding:22mm;margin:0 auto;background:#fff;}
@media print{
    body{background:#fff;}
    .box{display:none;}
    .print-area{box-shadow:none;width:100%;padding:0;margin:0;}
}
.check-group{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;}
.check-group label{display:flex;align-items:center;gap:4px;}
.check-group input{width:auto;}
</style>
</head>
<body>
<div class="box">
    <h3>📝 訂單打印工具 - 手動填寫版（已移除API載入）</h3>
    <div>
        <strong>選擇單據類型：</strong>
        <select id="invoiceType" onchange="refreshForm()">
            <option value="repair">維修服務發票</option>
            <option value="general">一般收據</option>
            <option value="sale">銷售貨品單</option>
        </select>
    </div>

    <!-- 維修單表單 -->
    <div id="repairForm">
        <h4>客戶資料</h4>
        <input id="inpCustName" placeholder="客戶姓名">
        <input id="inpTel" placeholder="聯絡電話">
        <textarea id="inpAddr" placeholder="送貨/地址" rows="2"></textarea>

        <h4>機器資料</h4>
        <input id="inpModel" placeholder="機型">
        <input id="inpSN" placeholder="序號SN">

        <h4>維修項目</h4>
        <div class="check-group">
            <label><input type="checkbox" id="chkDiag"> 專業故障診斷</label>
            <label><input type="checkbox" id="chkClean"> 深層清潔</label>
            <label><input type="checkbox" id="chkPart"> 零件更換</label>
            <label><input type="checkbox" id="chkOther"> 其他維修服務</label>
        </div>
        <textarea id="inpServiceText" placeholder="詳細維修內容" rows="2"></textarea>

        <h4>收費金額</h4>
        <input type="number" id="inpServiceFee" placeholder="維修費 HK$" value="0" oninput="calcRepair()">
        <input type="number" id="inpDelFee" placeholder="運送費 HK$" value="0" oninput="calcRepair()">
        <input readonly id="totalRepair" placeholder="總金額 HK$">

        <h4>備註</h4>
        <input id="inpWarranty" placeholder="保固月數">
        <textarea id="inpRemark" placeholder="其他備註" rows="2"></textarea>
    </div>

    <!-- 一般收據 -->
    <div id="generalForm" style="display:none;">
        <h4>收據內容</h4>
        <input id="genTitle" placeholder="收據標題">
        <textarea id="genContent" placeholder="收據明細" rows="4"></textarea>
        <input type="number" id="genAmount" placeholder="金額 HK$" value="0">
        <textarea id="genRemark" placeholder="備註" rows="2"></textarea>
    </div>

    <!-- 銷售單 -->
    <div id="saleForm" style="display:none;">
        <h4>客戶資料</h4>
        <input id="saleCustName" placeholder="客戶姓名">
        <input id="saleTel" placeholder="電話">
        <input id="saleWhatsapp" placeholder="WhatsApp">
        <textarea id="saleAddr" placeholder="地址" rows="2"></textarea>

        <h4>貨品資料</h4>
        <input id="saleModel" placeholder="貨品名稱">
        <input id="saleSpec" placeholder="規格">
        <div style="display:flex;gap:8px;">
            <input type="number" id="salePrice" placeholder="單價" value="0" oninput="calcSale()">
            <input type="number" id="saleQty" placeholder="數量" value="1" oninput="calcSale()">
            <input type="number" id="saleDisc" placeholder="折扣" value="0" oninput="calcSale()">
        </div>
        <input readonly id="totalSale" placeholder="應付金額 HK$">

        <h4>交收資訊</h4>
        <input id="saleDelMethod" placeholder="交貨方式">
        <input id="saleWarranty" placeholder="保固期限">
        <input id="salePay" placeholder="付款方式">
        <textarea id="saleRemark" placeholder="備註" rows="2"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-blue" onclick="refreshPreview()">更新預覽</button>
        <button class="btn-gray" onclick="window.print()">打印發票</button>
        <button class="btn-gray" onclick="clearAll()">清空所有</button>
    </div>
</div>

<!-- 打印預覽區 -->
<div class="print-area" id="printBox">
    <div style="text-align:center;margin-bottom:20px;">
        <h2>New Vision Tech Co Limited</h2>
        <p>旺角彌敦道610號荷里活廣場 | 電話：+852 2887 8820</p>
        <hr>
        <h3 id="printTitle">維修服務收據</h3>
        <p>開單日期：<span id="printDate"></span></p>
    </div>
    <div id="printContent"></div>
    <div style="margin-top:40px;text-align:right;">
        <p>客戶簽名：________________________</p>
        <p>店員簽名：________________________</p>
    </div>
</div>

<script>
// 頁面載入初始化日期
window.onload = function(){
    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    document.getElementById("printDate").innerText = dateStr;
    refreshForm();
    refreshPreview();
};

// 切換單據類型
function refreshForm(){
    const type = document.getElementById("invoiceType").value;
    document.getElementById("repairForm").style.display = "none";
    document.getElementById("generalForm").style.display = "none";
    document.getElementById("saleForm").style.display = "none";
    if(type === "repair"){
        document.getElementById("repairForm").style.display = "block";
        document.getElementById("printTitle").innerText = "維修服務收據";
    }else if(type === "general"){
        document.getElementById("generalForm").style.display = "block";
        document.getElementById("printTitle").innerText = "一般收據";
    }else if(type === "sale"){
        document.getElementById("saleForm").style.display = "block";
        document.getElementById("printTitle").innerText = "銷售貨品單";
    }
    refreshPreview();
}

// 維修單計算總額
function calcRepair(){
    const service = Number(document.getElementById("inpServiceFee").value) || 0;
    const del = Number(document.getElementById("inpDelFee").value) || 0;
    const total = service + del;
    document.getElementById("totalRepair").value = total.toFixed(2);
    refreshPreview();
}

// 銷售單計算
function calcSale(){
    const price = Number(document.getElementById("salePrice").value) || 0;
    const qty = Number(document.getElementById("saleQty").value) || 1;
    const disc = Number(document.getElementById("saleDisc").value) || 0;
    const total = (price * qty) - disc;
    document.getElementById("totalSale").value = total.toFixed(2);
    refreshPreview();
}

// 更新打印預覽
function refreshPreview(){
    const type = document.getElementById("invoiceType").value;
    let html = "";
    if(type === "repair"){
        html += `
        <table>
            <tr><th width="140">客戶姓名</th><td>${document.getElementById("inpCustName").value}</td></tr>
            <tr><th>聯絡電話</th><td>${document.getElementById("inpTel").value}</td></tr>
            <tr><th>地址</th><td>${document.getElementById("inpAddr").value}</td></tr>
            <tr><th>機型</th><td>${document.getElementById("inpModel").value}</td></tr>
            <tr><th>序號SN</th><td>${document.getElementById("inpSN").value}</td></tr>
        </table>
        <h4>維修項目</h4>
        <p>${document.getElementById("inpServiceText").value}</p>
        <p>項目：${[
            document.getElementById("chkDiag").checked ? "故障診斷":"",
            document.getElementById("chkClean").checked ? "深層清潔":"",
            document.getElementById("chkPart").checked ? "零件更換":"",
            document.getElementById("chkOther").checked ? "其他服務":""
        ].filter(x=>x).join("、")}</p>
        <table style="margin-top:16px;">
            <tr><th>維修費</th><td>HK$ ${document.getElementById("inpServiceFee").value}</td></tr>
            <tr><th>運送費</th><td>HK$ ${document.getElementById("inpDelFee").value}</td></tr>
            <tr style="font-weight:bold;font-size:16px;"><th>總金額</th><td>HK$ ${document.getElementById("totalRepair").value}</td></tr>
        </table>
        <h4>備註</h4>
        <p>保固：${document.getElementById("inpWarranty").value} 個月</p>
        <p>${document.getElementById("inpRemark").value}</p>
        `;
    }else if(type === "general"){
        html += `
        <h4>${document.getElementById("genTitle").value}</h4>
        <p style="white-space:pre-line;">${document.getElementById("genContent").value}</p>
        <p style="font-size:18px;font-weight:bold;">金額：HK$ ${document.getElementById("genAmount").value}</p>
        <h4>備註</h4>
        <p>${document.getElementById("genRemark").value}</p>
        `;
    }else if(type === "sale"){
        html += `
        <table>
            <tr><th width="140">客戶姓名</th><td>${document.getElementById("saleCustName").value}</td></tr>
            <tr><th>電話 / WhatsApp</th><td>${document.getElementById("saleTel").value} / ${document.getElementById("saleWhatsapp").value}</td></tr>
            <tr><th>地址</th><td>${document.getElementById("saleAddr").value}</td></tr>
        </table>
        <table style="margin-top:12px;">
            <tr>
                <th>貨品</th>
                <th>規格</th>
                <th>單價</th>
                <th>數量</th>
                <th>折扣</th>
            </tr>
            <tr>
                <td>${document.getElementById("saleModel").value}</td>
                <td>${document.getElementById("saleSpec").value}</td>
                <td>${document.getElementById("salePrice").value}</td>
                <td>${document.getElementById("saleQty").value}</td>
                <td>${document.getElementById("saleDisc").value}</td>
            </tr>
        </table>
        <p style="font-size:18px;font-weight:bold;text-align:right;">應付總額：HK$ ${document.getElementById("totalSale").value}</p>
        <h4>交收資訊</h4>
        <p>交貨：${document.getElementById("saleDelMethod").value}｜保固：${document.getElementById("saleWarranty").value}｜付款：${document.getElementById("salePay").value}</p>
        <h4>備註</h4>
        <p>${document.getElementById("saleRemark").value}</p>
        `;
    }
    document.getElementById("printContent").innerHTML = html;
}

// 清空全部欄位
function clearAll(){
    // 維修單
    document.getElementById("inpCustName").value = "";
    document.getElementById("inpTel").value = "";
    document.getElementById("inpAddr").value = "";
    document.getElementById("inpModel").value = "";
    document.getElementById("inpSN").value = "";
    document.getElementById("inpServiceText").value = "";
    document.getElementById("inpServiceFee").value = "0";
    document.getElementById("inpDelFee").value = "0";
    document.getElementById("inpWarranty").value = "";
    document.getElementById("inpRemark").value = "";
    document.getElementById("chkDiag").checked = false;
    document.getElementById("chkClean").checked = false;
    document.getElementById("chkPart").checked = false;
    document.getElementById("chkOther").checked = false;
    // 一般收據
    document.getElementById("genTitle").value = "";
    document.getElementById("genContent").value = "";
    document.getElementById("genAmount").value = "0";
    document.getElementById("genRemark").value = "";
    // 銷售單
    document.getElementById("saleCustName").value = "";
    document.getElementById("saleTel").value = "";
    document.getElementById("saleWhatsapp").value = "";
    document.getElementById("saleAddr").value = "";
    document.getElementById("saleModel").value = "";
    document.getElementById("saleSpec").value = "";
    document.getElementById("salePrice").value = "0";
    document.getElementById("saleQty").value = "1";
    document.getElementById("saleDisc").value = "0";
    document.getElementById("saleDelMethod").value = "";
    document.getElementById("saleWarranty").value = "";
    document.getElementById("salePay").value = "";
    document.getElementById("saleRemark").value = "";
    refreshForm();
}
</script>
</body>
</html>
