<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPGL 自動列印站</title>
<script src="https://unpkg.com/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
<style>
    body { font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .control-panel { max-width: 760px; margin: 0 auto 20px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px 24px; }
    .control-panel h3 { margin: 0 0 12px; }
    .stat-row { display: flex; gap: 24px; margin: 10px 0; font-size: 15px; flex-wrap: wrap; }
    .stat-row b { font-size: 18px; }
    .btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px; margin-top: 8px; }
    .btn-check { background: #2e7d32; color: #fff; }
    .btn-test { background: #1565c0; color: #fff; }
    .btn-reset { background: #e0e0e0; color: #333; }
    .status-line { margin-top: 10px; font-size: 14px; min-height: 20px; }
    .status-line.ok { color: #2e7d32; }
    .status-line.warn { color: #b8860b; }
    #log { margin-top: 12px; max-height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }
    .log-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .log-row .reprint { font-size: 12px; padding: 4px 10px; background: #fff3e0; border: 1px solid #ffb74d; border-radius: 4px; cursor: pointer; }
    .hint { font-size: 13px; color: #666; margin-top: 12px; line-height: 1.6; }

    /* 標籤（同主頁同一模板） */
    .label-card { width: 340px; margin: 20px auto; border: 1px solid #000; padding: 12px; background: #fff; box-sizing: border-box; }
    .labware-logo { width: 32%; height: auto; margin-bottom: 8px; display: block; }
    .label-line { margin: 6px 0; gap: 10px; display: flex; align-items: flex-start; }
    .label-title { font-size: 14px; min-width: 110px; flex-shrink: 0; font-weight: bold; padding-top: 2px; }
    #out-name { font-size: 13px; flex: 1; word-break: break-word; line-height: 1.3; }
    .doc-box { border: 2px solid #000; padding: 8px 14px; font-size: 28px; font-weight: bold; flex: 1; text-align: center; }
    #barcode { width: 75%; height: 60px; margin: 8px auto; display: block; }
    .addr-box { border: 2px solid #000; padding: 8px 14px; font-size: 24px; flex: 1; word-break: break-word; }
    .contact-box { border: none; font-size: 26px; font-weight: bold; flex: 1; }

    /* 85×60mm 列印：只印標籤 */
    @media print {
        .control-panel { display: none !important; }
        @page { size: 85mm 60mm; margin: 0; }
        html, body { margin: 0; padding: 0; background: #fff; }
        .label-card { width: 85mm; height: 60mm; margin: 0; border: 1px solid #000 !important; padding: 4mm !important; box-sizing: border-box; overflow: hidden !important; }
        .labware-logo { width: 19% !important; margin-bottom: 2mm !important; }
        .label-line { margin: 1.2mm 0 !important; gap: 2.5mm; }
        .label-title { font-size: 10pt !important; min-width: 26mm; padding-top: 1pt; }
        #out-name { font-size: 6pt !important; line-height: 1.2 !important; max-height: 2.4em !important; overflow: hidden !important; }
        .doc-box { border: 1.5px solid #000; padding: 0.8mm 2mm !important; font-size: 13pt !important; }
        #barcode { height: 11mm !important; width: 78% !important; margin: 1mm auto !important; }
        .addr-box { border: 1px solid #000; padding: 0.8mm 2mm !important; font-size: 11pt !important; }
        .contact-box { font-size: 12pt !important; }
    }
</style>
</head>
<body>
    <div class="control-panel">
        <h3>🖨️ UPGL 自動列印站</h3>
        <div class="stat-row">
            <div>已知單據：<b id="stat-known">-</b></div>
            <div>待列印：<b id="stat-queue">0</b></div>
            <div>已自動列印：<b id="stat-done">0</b></div>
        </div>
        <div>
            <button class="btn btn-check" onclick="checkForNew(true)">立即檢查</button>
            <button class="btn btn-test" onclick="testPrint()">列印測試頁</button>
            <button class="btn btn-reset" onclick="resetBaseline()">重設 baseline</button>
        </div>
        <div class="status-line" id="status"></div>
        <h4 style="margin:16px 0 4px;">列印記錄</h4>
        <div id="log"><div class="log-row" style="color:#999;">暫無記錄</div></div>
        <div class="hint">
            每 30 秒自動檢查一次 Lark 同步數據；首次啟動會將現有單據設為 baseline（唔會一次過印晒），之後出現嘅<strong>新 Doc Number</strong>先會自動列印。<br>
            呢頁要用 Chrome 嘅 <code>--kiosk-printing</code> 模式開啟，先可以唔經對話框直接列印去預設打印機（標籤打印機要設為系統預設）。
        </div>
    </div>

    <!-- 標籤（列印用） -->
    <div class="label-card" id="label">
        <img src="Image.png" class="labware-logo" alt="LABWARE GROUP">
        <div class="label-line">
            <div class="label-title">Customer Name :</div>
            <div id="out-name">-</div>
        </div>
        <div class="label-line">
            <div class="label-title">Doc Number :</div>
            <div class="doc-box" id="out-doc">-</div>
        </div>
        <svg id="barcode"></svg>
        <div class="label-line">
            <div class="label-title">Ship-to Address :</div>
            <div class="addr-box" id="out-addr">-</div>
        </div>
        <div class="label-line">
            <div class="label-title">Contact Name</div>
            <div class="contact-box" id="out-contact">-</div>
        </div>
    </div>

<script>
    // 同主頁一樣：經 raw.githubusercontent.com 拎最新，唔經 Pages 部署
    const DATA_URLS = [
        'https://raw.githubusercontent.com/Techyanlam/Website/main/lark_shipment_data.json',
        'lark_shipment_data.json'
    ];
    const LS_KEY = 'upgl_printed_docs';
    const CHECK_MS = 30 * 1000;

    const printQueue = [];
    let isPrinting = false;
    let autoCount = 0;

    function setStatus(msg, cls) {
        const el = document.getElementById('status');
        el.innerText = msg;
        el.className = 'status-line ' + (cls || '');
    }

    function getKnown() {
        try { return new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); }
        catch (e) { return new Set(); }
    }
    function saveKnown(set) {
        localStorage.setItem(LS_KEY, JSON.stringify([...set]));
    }

    async function fetchLatestData() {
        let lastErr = null;
        for (const base of DATA_URLS) {
            try {
                const resp = await fetch(base + '?t=' + Date.now());
                if (!resp.ok) throw new Error('讀取失敗');
                const data = await resp.json();
                return data.filter(r => r && r.docNumber);
            } catch (e) { lastErr = e; }
        }
        throw lastErr || new Error('讀取失敗');
    }

    function fillLabel(rec) {
        document.getElementById('out-name').innerText = rec.customerName || '-';
        document.getElementById('out-doc').innerText = rec.docNumber || '-';
        document.getElementById('out-addr').innerText = rec.shipToAddress || '-';
        document.getElementById('out-contact').innerText = rec.contactName || '-';
        JsBarcode("#barcode", rec.docNumber || '-', {
            format: "CODE128", width: 2, height: 60, displayValue: false, margin: 0
        });
    }

    function markPrinted(rec) {
        const known = getKnown();
        known.add((rec.docNumber || '').toUpperCase());
        saveKnown(known);
        document.getElementById('stat-known').innerText = known.size;
    }

    function addLog(rec, auto) {
        const log = document.getElementById('log');
        const empty = log.querySelector('.log-row[style]');
        if (empty) empty.remove();
        const row = document.createElement('div');
        row.className = 'log-row';
        const time = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        row.innerHTML = `<span>${time}　<b>${rec.docNumber}</b>　${rec.customerName || ''}${auto ? '' : '（手動重印）'}</span>`;
        const btn = document.createElement('button');
        btn.className = 'reprint';
        btn.innerText = '重印';
        btn.onclick = () => { fillLabel(rec); setTimeout(() => window.print(), 400); addLog(rec, false); };
        row.appendChild(btn);
        log.prepend(row);
        while (log.children.length > 100) log.lastChild.remove();
    }

    async function processQueue() {
        if (isPrinting || !printQueue.length) return;
        isPrinting = true;
        const rec = printQueue.shift();
        document.getElementById('stat-queue').innerText = printQueue.length;
        fillLabel(rec);
        await new Promise(r => setTimeout(r, 500)); // 等 barcode 畫完
        window.print();
        markPrinted(rec);
        autoCount++;
        document.getElementById('stat-done').innerText = autoCount;
        addLog(rec, true);
        isPrinting = false;
        if (printQueue.length) setTimeout(processQueue, 2500);
    }

    async function checkForNew(manual) {
        try {
            const valid = await fetchLatestData();
            const known = getKnown();
            let added = 0;
            for (const r of valid) {
                const key = (r.docNumber || '').toUpperCase();
                if (key && !known.has(key)) {
                    printQueue.push(r);
                    added++;
                }
            }
            document.getElementById('stat-queue').innerText = printQueue.length;
            const time = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            if (added) {
                setStatus(`✓ ${time} 發現 ${added} 張新單，開始自動列印…`, 'ok');
                processQueue();
            } else if (manual) {
                setStatus(`✓ ${time} 檢查完成：${valid.length} 筆，無新單`, 'ok');
            }
        } catch (e) {
            setStatus('檢查失敗：' + e.message + '，30 秒後再試', 'warn');
        }
    }

    function testPrint() {
        fillLabel({ docNumber: 'HKLSI26050656', customerName: '測試客戶 Test Customer', shipToAddress: '新界-小蠔灣', contactName: '測試聯絡人' });
        setTimeout(() => window.print(), 500);
    }

    function resetBaseline() {
        if (!confirm('確定重設？會將而家所有單據重新設為「已知」，之後先出現嘅新單先會印。')) return;
        localStorage.removeItem(LS_KEY);
        initBaseline();
    }

    async function initBaseline() {
        setStatus('初始化緊…', '');
        try {
            const valid = await fetchLatestData();
            const known = getKnown();
            if (known.size === 0) {
                // 首次啟動：現有全部設為已知，唔會一次印晒
                valid.forEach(r => known.add((r.docNumber || '').toUpperCase()));
                saveKnown(known);
                setStatus(`✓ Baseline 已建立（${known.size} 筆），之後嘅新單先會自動列印`, 'ok');
            } else {
                setStatus(`✓ 已載入 baseline（${known.size} 筆），開始監察新單`, 'ok');
            }
            document.getElementById('stat-known').innerText = known.size;
        } catch (e) {
            setStatus('初始化失敗：' + e.message, 'warn');
        }
    }

    // 啟動
    (async () => {
        await initBaseline();
        setInterval(() => checkForNew(false), CHECK_MS);
        setTimeout(() => checkForNew(false), 5000);
    })();
</script>
</body>
</html>
