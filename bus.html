<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Ink Dashboard (Hong Kong) - Dynamic GPS Transit</title>
  <style>
    /* =========================================================
       全局重置與 E-ink 最佳化設定
       ========================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { background-color: #ffffff; color: #000000; font-family: "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", -apple-system, sans-serif; padding: 16px; line-height: 1.4; display: flex; justify-content: center; }
    .dashboard-container { width: 100%; max-width: 1200px; border: 4px solid #000000; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* =========================================================
       頂部：時鐘、日期與即時天氣
       ========================================================= */
    .header-panel { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; border-bottom: 4px solid #000000; padding-bottom: 16px; }
    .time-display { font-size: 5rem; font-weight: 900; line-height: 1; letter-spacing: -2px; }
    .date-location-display { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center;}
    .date-text { font-size: 1.6rem; font-weight: bold; }
    .gps-status { font-size: 1.2rem; font-weight: bold; padding: 4px 8px; display: inline-block; border: 2px solid #000; }
    
    .weather-current { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .temp-text { font-size: 3.5rem; font-weight: bold; line-height: 1; }
    .weather-desc-text { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }

    /* =========================================================
       主體區域共用
       ========================================================= */
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { display: flex; flex-direction: column; }
    .panel-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid #000000; padding-bottom: 8px; margin-bottom: 12px; }
    .panel-title { font-size: 1.4rem; font-weight: 900; }
    .refresh-badge { font-size: 0.85rem; border: 1px solid #000000; padding: 2px 6px; font-weight: bold; }

    /* 巴士列表 */
    .bus-list { display: flex; flex-direction: column; }
    .bus-item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 2px dashed #000000; }
    .bus-route { font-size: 2rem; font-weight: 900; width: 70px; }
    .co-badge { font-size: 0.75rem; border: 1px solid #000; padding: 1px 4px; display: inline-block; margin-bottom: 2px; font-weight: normal; }
    .bus-info { display: flex; flex-direction: column; align-items: flex-start; }
    .bus-dest { font-size: 1.2rem; font-weight: bold; }
    .bus-stop { font-size: 0.9rem; }
    .bus-etas { font-size: 1.6rem; font-weight: bold; text-align: right; }
    .bus-etas span { margin-left: 12px; }
    .eta-min { font-size: 1rem; font-weight: normal; }

    /* 天氣預報表格 */
    .forecast-table { width: 100%; border-collapse: collapse; }
    .forecast-table th { text-align: left; font-size: 1rem; border-bottom: 2px solid #000000; padding: 8px 4px; }
    .forecast-table td { border-bottom: 2px dashed #000000; padding: 16px 4px; vertical-align: middle; }
    .fc-day { font-size: 1.2rem; font-weight: bold; width: 20%; }
    .fc-desc { font-size: 1rem; width: 55%; padding-right: 16px; }
    .fc-temp-rain { width: 25%; text-align: right; font-size: 1.1rem; font-weight: bold; }
    .fc-rain { font-size: 0.9rem; font-weight: normal; margin-top: 4px; }

    /* =========================================================
       Google 日曆與 Gmail 區塊
       ========================================================= */
    .google-section { border-top: 4px solid #000000; padding-top: 16px; margin-top: 8px; }
    .auth-buttons { margin-bottom: 12px; display: flex; gap: 8px; }
    .auth-btn { border: 2px solid #000; background: #fff; color: #000; font-weight: bold; padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 1rem; }
    .auth-btn:hover { background: #000; color: #fff; }
    .auth-btn:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; background: #fff; }
    .google-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .google-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .google-item { border-bottom: 1px dashed #000; padding-bottom: 8px; }
    .g-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .g-time { font-size: 0.9rem; }
    .g-sender { font-size: 0.9rem; font-style: italic; }
    .cal-badge { font-size: 0.75rem; border: 1px solid #000; background: #000; color: #fff; padding: 1px 4px; margin-left: 6px; font-weight: bold; vertical-align: middle; border-radius: 2px;}

    /* 底部區域：新聞 */
    .news-panel { border-top: 4px solid #000000; padding-top: 16px; }
    .news-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-top: 12px; list-style: none; }
    .news-item { font-size: 1rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; padding-left: 16px; }
    .news-item::before { content: "■"; position: absolute; left: 0; top: 0; font-size: 0.8rem; }

    /* 頁尾 */
    .footer-bar { margin-top: 8px; display: flex; justify-content: space-between; font-size: 0.85rem; border-top: 1px solid #000000; padding-top: 8px; font-weight: bold; }

    @media (max-width: 800px) {
      .header-panel { grid-template-columns: 1fr; text-align: center; gap: 12px; }
      .weather-current { align-items: center; }
      .main-grid, .google-grid, .news-grid { grid-template-columns: 1fr; }
    }
  </style>

  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
</head>
<body>

<div class="dashboard-container">
  
  <div class="header-panel">
    <div class="time-display" id="clock-time">--:--</div>
    <div class="date-location-display">
      <div class="date-text" id="clock-date">----年--月--日 星期-</div>
      <span class="gps-status" id="gps-status-text">📍 啟動 GPS 中...</span>
    </div>
    <div class="weather-current">
      <div class="temp-text"><span id="curr-temp">--</span>°C</div>
      <div class="weather-desc-text" id="curr-desc">載入中... 濕度 --%</div>
    </div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">雷達: 附近車站預計到站時間</div>
        <div class="refresh-badge">自動定位 更新</div>
      </div>
      <div class="bus-list" id="bus-container">
        <div class="bus-item" style="border:none;">等待 GPS 權限以掃描附近車站...</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">香港天文台天氣預報</div>
        <div class="refresh-badge">15分鐘更新</div>
      </div>
      <table class="forecast-table">
        <thead>
          <tr><th>日子</th><th>天氣預測</th><th style="text-align: right;">氣溫/降雨</th></tr>
        </thead>
        <tbody id="forecast-tbody"><tr><td colspan="3">載入資料中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="google-section">
    <div class="panel-header" style="margin-bottom: 8px;">
      <div class="panel-title" style="font-size: 1.1rem;">整合工作助理 (Google & 飛書)</div>
      <div class="auth-buttons">
        <button id="authorize_button" class="auth-btn" onclick="handleAuthClick()" disabled>登入 Google</button>
        <button id="signout_button" class="auth-btn" onclick="handleSignoutClick()" style="display: none;">登出</button>
      </div>
    </div>
    <div class="google-grid">
      <div class="panel">
        <div style="font-weight: bold; border-bottom: 2px solid #000; margin-bottom: 8px; padding-bottom: 4px;">📅 即將到來的行程</div>
        <ul class="google-list" id="calendar-container">
          <li class="google-item">載入中...</li>
        </ul>
      </div>
      <div class="panel">
        <div style="font-weight: bold; border-bottom: 2px solid #000; margin-bottom: 8px; padding-bottom: 4px;">✉️ 未讀郵件 <span id="unread-count"></span></div>
        <ul class="google-list" id="gmail-container">
          <li class="google-item">請先登入 Google 帳號授權。</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="panel news-panel">
    <div class="panel-header" style="border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 8px;">
      <div class="panel-title" id="news-panel-title" style="font-size: 1.1rem;">即時綜合新聞</div>
      <div class="refresh-badge">15分鐘更新</div>
    </div>
    <ul class="news-grid" id="news-container">
      <li class="news-item">嘗試連接新聞伺服器中...</li>
    </ul>
  </div>

  <div class="footer-bar">
    <div>資料來源：天文台 / 運輸署動態站點 / 綜合新聞 / Google / 飛書</div>
    <div id="last-update">系統啟動中...</div>
  </div>

</div>

<script>
  /* =========================================================
     🛑🛑🛑 Google API 與 飛書日曆 設定區 🛑🛑🛑
     ========================================================= */
  const GOOGLE_CLIENT_ID = '32327213493-1dqkm15k6kn8dorc6iaf37v4rlqneljt.apps.googleusercontent.com';
  const GOOGLE_API_KEY = 'AIzaSyAf6qFHgmZrjl6Q1f9y0AfiTv0GKRDmbWE';
  const LARK_ICS_URL = ''; // 若有飛書訂閱連結請填入此處
  
  const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/gmail.readonly';
  const DISCOVERY_DOCS = [ 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest', 'https://www.googleapis.com/discovery/v1/apis/gmail/v1/rest' ];

  let tokenClient; let gapiInited = false; let gisInited = false;
  function gapiLoaded() { gapi.load('client', initializeGapiClient); }
  async function initializeGapiClient() {
    try { await gapi.client.init({ apiKey: GOOGLE_API_KEY, discoveryDocs: DISCOVERY_DOCS }); gapiInited = true; maybeEnableButtons(); } catch (err) {}
  }
  function gisLoaded() {
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: SCOPES,
        callback: (t) => {
          if (t && t.access_token) {
            document.getElementById('authorize_button').style.display = 'none'; document.getElementById('signout_button').style.display = 'inline-block';
            fetchCombinedCalendarData(); setInterval(fetchCombinedCalendarData, 15 * 60 * 1000);
          }
        },
      });
      gisInited = true; maybeEnableButtons();
    } catch (err) {}
  }
  function maybeEnableButtons() { if (gapiInited && gisInited) document.getElementById('authorize_button').disabled = false; }
  function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }
  function handleSignoutClick() {
    const t = gapi.client.getToken();
    if (t !== null) {
      google.accounts.oauth2.revoke(t.access_token); gapi.client.setToken('');
      document.getElementById('gmail-container').innerHTML = '<li class="google-item">已登出，請重新授權。</li>';
      document.getElementById('authorize_button').style.display = 'inline-block'; document.getElementById('signout_button').style.display = 'none';
      fetchCombinedCalendarData(); 
    }
  }

  // =========================================
  // 飛書與 Google 行程解析
  // =========================================
  async function fetchLarkEvents() {
    if (!LARK_ICS_URL) return [];
    try {
      const cacheBusterUrl = LARK_ICS_URL + (LARK_ICS_URL.includes('?') ? '&' : '?') + 'cb=' + Date.now();
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(cacheBusterUrl)}`;
      const res = await fetch(proxyUrl);
      const data = await res.json();
      if (!data.contents) return [];
      
      const jcalData = ICAL.parse(data.contents);
      const comp = new ICAL.Component(jcalData);
      const vevents = comp.getAllSubcomponents("vevent");
      const events = []; const now = ICAL.Time.now();
      
      vevents.forEach(vevent => {
        try {
          const event = new ICAL.Event(vevent);
          if (event.isRecurring()) {
            const expand = event.iterator(); let next; let count = 0;
            while ((next = expand.next()) && count < 5) {
              if (next.compare(now) >= 0) { events.push({ summary: event.summary, time: next.toJSDate(), isAllDay: event.startDate.isDate, source: '飛書' }); count++; }
            }
          } else {
            if (event.endDate.compare(now) >= 0) events.push({ summary: event.summary, time: event.startDate.toJSDate(), isAllDay: event.startDate.isDate, source: '飛書' });
          }
        } catch(e) {} 
      });
      return events;
    } catch (err) { return []; }
  }

  async function fetchGmail() {
    try {
      const gmailRes = await gapi.client.gmail.users.messages.list({ 'userId': 'me', 'q': 'is:unread in:inbox', 'maxResults': 3 });
      document.getElementById('unread-count').textContent = `(共 ${gmailRes.result.resultSizeEstimate || 0} 封)`;
      const messages = gmailRes.result.messages || [];
      if (messages.length === 0) {
        document.getElementById('gmail-container').innerHTML = '<li class="google-item">收件匣沒有未讀郵件。</li>';
      } else {
        let htmlStr = '';
        for (const msg of messages) {
          const detail = await gapi.client.gmail.users.messages.get({ 'userId': 'me', 'id': msg.id, 'format': 'metadata', 'metadataHeaders': ['Subject', 'From'] });
          let sub = '無主旨', from = '未知';
          detail.result.payload.headers.forEach(h => { if(h.name==='Subject') sub=h.value; if(h.name==='From') from=h.value.replace(/<.*>/, '').trim(); });
          htmlStr += `<li class="google-item"><div class="g-title">▪ ${sub}</div><div class="g-sender">來自: ${from}</div></li>`;
        }
        document.getElementById('gmail-container').innerHTML = htmlStr;
      }
    } catch(err) {}
  }

  async function fetchCombinedCalendarData() {
    let allEvents = [];
    const calContainer = document.getElementById('calendar-container');
    const token = gapi.client.getToken();

    if (LARK_ICS_URL) allEvents = allEvents.concat(await fetchLarkEvents());
    if (token) {
      fetchGmail();
      try {
        const calListRes = await gapi.client.calendar.calendarList.list();
        const nowIso = (new Date()).toISOString();
        for (const cal of calListRes.result.items) {
          try {
            const eventsRes = await gapi.client.calendar.events.list({ 'calendarId': cal.id, 'timeMin': nowIso, 'showDeleted': false, 'singleEvents': true, 'maxResults': 4, 'orderBy': 'startTime' });
            if (eventsRes.result.items) {
              eventsRes.result.items.forEach(e => {
                let timeObj = e.start.dateTime ? new Date(e.start.dateTime) : new Date(e.start.date);
                allEvents.push({ summary: e.summary, time: timeObj, isAllDay: !e.start.dateTime, source: cal.primary ? '' : cal.summary });
              });
            }
          } catch (err) {}
        }
      } catch (err) {}
    }

    if (allEvents.length > 0) {
      allEvents.sort((a, b) => a.time - b.time);
      calContainer.innerHTML = allEvents.slice(0, 4).map(event => {
        let when = event.isAllDay ? `${event.time.getMonth()+1}/${event.time.getDate()} (全天)` : `${event.time.getMonth()+1}/${event.time.getDate()} ${event.time.getHours().toString().padStart(2,'0')}:${event.time.getMinutes().toString().padStart(2,'0')}`;
        const badge = event.source ? `<span class="cal-badge">${event.source}</span>` : '';
        return `<li class="google-item"><div class="g-title">▪ ${event.summary || '無標題'} ${badge}</div><div class="g-time">時間: ${when}</div></li>`;
      }).join('');
    } else {
      if (!LARK_ICS_URL && !token) calContainer.innerHTML = '<li class="google-item">請登入 Google 或設定飛書日曆連結。</li>';
      else calContainer.innerHTML = '<li class="google-item">近期沒有行程。</li>';
    }
  }

  /* =========================================================
     🌟 巴士引擎 2.0 (全自動動態雷達定位 + 九巴/城巴實時 API)
     ========================================================= */
  let userLoc = null;
  let allStopsCache = []; // 儲存全港巴士站座標的記憶體快取

  function deg2rad(deg) { return deg * (Math.PI/180) }
  function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
    var R = 6371; var dLat = deg2rad(lat2-lat1); var dLon = deg2rad(lon2-lon1); 
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  // 1. 初始化下載全港巴士站點 (只會執行一次)
  async function loadAllStops() {
    if (allStopsCache.length > 0) return true;
    try {
      const [kmbRes, ctbRes] = await Promise.all([
        fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop').catch(()=>null),
        fetch('https://rt.data.gov.hk/v2/transport/citybus/stop').catch(()=>null)
      ]);
      if (kmbRes && kmbRes.ok) {
        const kmbData = await kmbRes.json();
        kmbData.data.forEach(s => allStopsCache.push({ co: 'kmb', id: s.stop, name: s.name_tc, lat: parseFloat(s.lat), lng: parseFloat(s.long || s.lng) }));
      }
      if (ctbRes && ctbRes.ok) {
        const ctbData = await ctbRes.json();
        ctbData.data.forEach(s => allStopsCache.push({ co: 'ctb', id: s.stop, name: s.name_tc, lat: parseFloat(s.lat), lng: parseFloat(s.long || s.lng) }));
      }
      return allStopsCache.length > 0;
    } catch(err) { return false; }
  }

  // 2. 獲取定位
  function updateGPS() {
    const statusText = document.getElementById('gps-status-text');
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLoc = { lat: position.coords.latitude, lng: position.coords.longitude };
          statusText.textContent = `📍 已定位附近車站`;
          fetchDynamicBusETA();
        },
        (error) => { 
          let errMsg = '無法獲取位置';
          if (error.code === 1) errMsg = '定位權限被拒絕';
          statusText.textContent = `📍 ${errMsg}`; 
          document.getElementById('bus-container').innerHTML = `<div class="bus-item" style="border:none;">${errMsg}，請在瀏覽器設定中允許位置權限。</div>`;
        }, 
        { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
      );
    } else { statusText.textContent = '📍 裝置不支援定位'; }
  }

  // 3. 搜尋附近車站並獲取 ETA
  async function fetchDynamicBusETA() {
    if (!userLoc) return; // 等待定位完成
    
    // 如果尚未下載車站資料，顯示提示並下載
    if (allStopsCache.length === 0) {
      document.getElementById('bus-container').innerHTML = '<div class="bus-item" style="border:none;">首次啟動，下載全港車站資料中...</div>';
      const ok = await loadAllStops();
      if (!ok) {
        document.getElementById('bus-container').innerHTML = '<div class="bus-item" style="border:none;">下載車站清單失敗，請檢查網絡。</div>';
        return;
      }
    }

    // 計算距離，篩選出半徑 500 米內的車站
    const nearby = allStopsCache
      .map(s => ({ ...s, dist: getDistanceFromLatLonInKm(userLoc.lat, userLoc.lng, s.lat, s.lng) }))
      .filter(s => s.dist < 0.5)
      .sort((a, b) => a.dist - b.dist);

    // 取距離最近的 4 個實體車站
    const topStops = nearby.slice(0, 4);

    if (topStops.length === 0) {
      document.getElementById('bus-container').innerHTML = '<div class="bus-item" style="border:none;">半徑 500 米內找不到九巴或城巴車站。</div>';
      return;
    }

    let allEtas = [];
    const now = new Date();

    // 針對這幾個最近的車站，呼叫 ETA API
    for (const stop of topStops) {
      try {
        let url = stop.co === 'kmb' 
          ? `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop.id}` 
          : `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stop.id}`;
        
        const res = await fetch(url);
        if (!res.ok) continue;
        const result = await res.json();

        (result.data || []).forEach(eta => {
          if (eta.eta) {
            const diffMs = new Date(eta.eta.replace(/-/g, '/').replace('T', ' ')).getTime() - now.getTime();
            if (diffMs >= 0) {
              allEtas.push({
                co: stop.co, route: eta.route, dest: eta.dest_tc, stopName: stop.name, dist: stop.dist,
                min: Math.floor(diffMs / 60000),
                isScheduled: eta.rmk_tc && (eta.rmk_tc.includes('原定') || eta.rmk_tc.includes('預定'))
              });
            }
          }
        });
      } catch(err) {}
    }

    // 將所有路線合併分組 (路線 + 目的地)
    const grouped = {};
    allEtas.forEach(e => {
      const key = `${e.co}-${e.route}-${e.dest}-${e.stopName}`;
      if (!grouped[key]) grouped[key] = { co: e.co, route: e.route, dest: e.dest, stopName: e.stopName, dist: e.dist, etas: [] };
      grouped[key].etas.push({ min: e.min, isScheduled: e.isScheduled });
    });

    // 每個路線過濾掉重複的分鐘數，並排序
    let groupArray = Object.values(grouped);
    groupArray.forEach(g => {
      const uniqueMins = new Set();
      g.etas = g.etas.filter(e => {
        if (uniqueMins.has(e.min)) return false;
        uniqueMins.add(e.min); return true;
      }).sort((a,b) => a.min - b.min).slice(0, 3);
    });

    // 剃除沒有 ETA 的群組，並根據最快到站時間排序
    groupArray = groupArray.filter(g => g.etas.length > 0);
    groupArray.sort((a, b) => {
      if (a.etas[0].min === b.etas[0].min) return a.dist - b.dist; // 時間相同則按距離排序
      return a.etas[0].min - b.etas[0].min;
    });

    // 顯示前 6 條即將到達的路線
    const displayGroups = groupArray.slice(0, 6);
    let htmlStr = '';
    
    if (displayGroups.length === 0) {
      htmlStr = '<div class="bus-item" style="border:none;">附近車站暫無即將到來的班次。</div>';
    } else {
      displayGroups.forEach(g => {
        const coBadge = g.co === 'ctb' ? '<span class="co-badge">城巴</span>' : '<span class="co-badge">九巴</span>';
        const etaHtml = g.etas.map(m => `<span>${m.min}<span class="eta-min">分${m.isScheduled ? '*' : ''}</span></span>`).join('');
        // 將距離轉換成好閱讀的格式
        const distStr = g.dist < 0.1 ? '(<100m)' : `(${(g.dist * 1000).toFixed(0)}m)`;

        htmlStr += `
          <div class="bus-item">
            <div class="bus-route">${g.route}</div>
            <div class="bus-info">
              <span class="bus-dest">${coBadge} 往 ${g.dest}</span>
              <span class="bus-stop">${g.stopName} <span style="font-size:0.75rem; color:#666;">${distStr}</span></span>
            </div>
            <div class="bus-etas">${etaHtml}</div>
          </div>
        `;
      });
    }

    document.getElementById('bus-container').innerHTML = htmlStr;
    updateLastUpdateTime('巴士');
  }

  // =========================================
  // 其他更新功能
  // =========================================
  function updateClock() {
    const now = new Date(); const pad = n => n.toString().padStart(2, '0');
    document.getElementById('clock-time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    document.getElementById('clock-date').textContent = `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日 ${days[now.getDay()]}`;
  }

  async function fetchWeather() {
    try {
      const currentRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
      const currentData = await currentRes.json();
      document.getElementById('curr-temp').textContent = currentData.temperature.data[0].value;
      document.getElementById('curr-desc').textContent = `${currentData.warningMessage ? '有天氣警告' : '大致多雲'} · 濕度 ${currentData.humidity.data[0].value}%`;

      const forecastRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
      const forecastData = await forecastRes.json();
      document.getElementById('forecast-tbody').innerHTML = forecastData.weatherForecast.slice(0, 4).map(day => `
        <tr><td class="fc-day">${day.week}</td><td class="fc-desc">${day.forecastWeather}</td><td class="fc-temp-rain">${day.forecastMintemp.value}° - ${day.forecastMaxtemp.value}°<br><span class="fc-rain">降雨: ${day.PSR}</span></td></tr>
      `).join('');
      updateLastUpdateTime('天氣');
    } catch (error) {}
  }

  async function fetchNews() {
    const sources = [
      { name: '香港電台', url: 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://rthk9.rthk.hk/rthk/news/rss/c_expressnews_cnews.xml') },
      { name: 'Yahoo 港聞', url: 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://hk.news.yahoo.com/rss/hong-kong') }
    ];
    for (let source of sources) {
      try {
        const res = await fetch(source.url); if (!res.ok) continue;
        const data = await res.json();
        if (data.status === 'ok' && data.items && data.items.length > 0) {
          document.getElementById('news-container').innerHTML = data.items.slice(0, 6).map(item => `<li class="news-item" title="${item.title}">${item.title}</li>`).join('');
          document.getElementById('news-panel-title').textContent = `即時綜合新聞 (${source.name})`; updateLastUpdateTime('新聞'); return;
        }
      } catch (err) {}
    }
    document.getElementById('news-container').innerHTML = '<li class="news-item">新聞載入失敗</li>';
  }

  function updateLastUpdateTime(type) {
    const pad = n => n.toString().padStart(2, '0'); const now = new Date();
    document.getElementById('last-update').textContent = `最後更新 (${type})：${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  /* =========================================================
     啟動程序
     ========================================================= */
  updateClock(); setInterval(updateClock, 1000); 
  
  // 啟動定位 (每 5 分鐘重新定位一次跟隨您的步伐)
  updateGPS(); setInterval(updateGPS, 5 * 60 * 1000); 
  
  // 巴士 ETA 每 1 分鐘基於最新定位重新獲取一次
  setInterval(fetchDynamicBusETA, 60 * 1000); 
  
  fetchWeather(); fetchNews(); 
  fetchCombinedCalendarData(); setInterval(fetchCombinedCalendarData, 15 * 60 * 1000);
  setInterval(() => { fetchWeather(); fetchNews(); }, 15 * 60 * 1000);

</script>
</body>
</html>
