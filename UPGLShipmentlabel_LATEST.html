<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>物流標籤產生器</title>
    <script src="https://unpkg.com/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: Arial, "Microsoft JhengHei", sans-serif; padding: 20px; margin:0; }
        .input-section { margin-bottom: 30px; padding: 20px; border: 1px dashed #ccc; background: #f9f9f9; max-width: 600px; }
        .field-row { margin: 12px 0; display: flex; align-items: center; }
        .field-row label { width: 140px; font-weight: bold; }
        input { width: 250px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size:14px; }
        button { padding:10px 24px; font-size:15px; background:#0055aa; color:#fff; border:none; border-radius:6px; cursor:pointer; margin-top:10px; }

        /* 同步查詢按鈕樣式 */
        .sync-btn { background: #00b96b; margin-left: 10px; padding: 8.5px 15px; font-size: 14px; margin-top: 0; }
        .sync-btn:hover { background: #009959; }
        .sync-btn:disabled { background: #cccccc; cursor: not-allowed; }
        .status-line { font-size: 13px; color: #555; margin: 4px 0 0 140px; min-height: 18px; }
        .status-line.ok { color: #0a7d3b; }
        .status-line.warn { color: #b26a00; }

        /* 螢幕預覽樣式 */
        .label-card {
            width: 100%; max-width:850px;
            border: 2px solid #000;
            padding:15px;
            background:#fff;
            box-sizing:border-box;
        }
        .labware-logo { width: 20%; height:auto; display:block; margin-bottom:12px; }
        .label-line { margin:10px 0; display:flex; align-items:flex-start; gap:12px; }
        .label-title { font-size:18px; min-width:160px; font-weight:bold; flex-shrink:0; padding-top: 2px; }
        #out-name { font-size: 13px; flex: 1; word-break: break-word; overflow: hidden; line-height: 1.2; max-height: 2.4em; }
        .doc-box { border:2px solid #000; padding:8px 14px; font-size:32px; font-weight:bold; flex:1; text-align:center; }
        #barcode { width:75%; height:60px; margin:8px auto; display:block; }
        .addr-box { border:2px solid #000; padding:8px 14px; font-size:28px; flex:1; word-break: break-word; }
        .contact-box { border:none; font-size:30px; font-weight:bold; flex:1; }

        /* 85×60mm 列印樣式 */
        @media print {
            .input-section { display:none !important; }
            @page { size: 85mm 60mm; margin: 0; scale: 1; }
            html, body { margin:0; padding:0; height:100%; }
            .label-card { width: 85mm; height: 60mm; border: 1px solid #000 !important; padding: 4mm !important; box-sizing: border-box; overflow: hidden !important; }
            .labware-logo { width: 19% !important; height:auto !important; margin-bottom: 2mm !important; display:block; }
            .label-line { margin: 1.2mm 0 !important; gap: 2.5mm; display:flex; align-items:flex-start; }
            .label-title { font-size: 10pt !important; min-width: 26mm; flex-shrink:0; font-weight:bold; padding-top: 1pt; }
            #out-name { font-size: 6pt !important; flex: 1 !important; word-break: break-word !important; overflow: hidden !important; line-height: 1.2 !important; max-height: 2.4em !important; }
            .doc-box { border: 1.5px solid #000; padding: 0.8mm 2mm !important; font-size: 13pt !important; font-weight:bold; flex:1; text-align:center; }
            #barcode { height: 11mm !important; width: 78% !important; margin: 1mm auto !important; display:block; }
            .addr-box { border: 1px solid #000; padding: 0.8mm 2mm !important; font-size: 11pt !important; flex:1; word-break: break-word !important; }
            .contact-box { font-size: 12pt !important; font-weight:bold; flex:1; }
        }
    </style>
</head>
<body>
    <!-- 輸入面板 -->
    <div class="input-section">
        <h3>物流標籤資料填寫</h3>

        <div class="field-row">
            <label>Doc Number：</label>
            <input id="in-doc" value="HKLSI26050656" oninput="onDocInput()" onkeydown="if(event.key==='Enter'){lookupNow();}">
            <button class="sync-btn" onclick="refreshFromServer()" id="syncBtn">同步查詢</button>
        </div>
        <div class="status-line" id="sync-status"></div>
        <div class="field-row">
            <label>Customer Name：</label>
            <input id="in-name" oninput="updateLabel()" placeholder="客戶名稱">
        </div>
        <div class="field-row">
            <label>Ship-to Address：</label>
            <input id="in-addr" value="九龍-理大" oninput="updateLabel()">
        </div>
        <div class="field-row">
            <label>Contact Name：</label>
            <input id="in-contact" value="Ken Chan" oninput="updateLabel()">
        </div>

        <button onclick="generateAndPrint()">生成並列印標籤</button>
    </div>

    <!-- 標籤預覽 -->
    <div class="label-card" id="label">
        <img src="Image.png" class="labware-logo" alt="LABWARE GROUP To be your partner in laboratory">

        <div class="label-line">
            <div class="label-title">Customer Name :</div>
            <div id="out-name">-</div>
        </div>

        <div class="label-line">
            <div class="label-title">Doc Number :</div>
            <div class="doc-box" id="out-doc">HKLSI26050656</div>
        </div>

        <svg id="barcode"></svg>

        <div class="label-line">
            <div class="label-title">Ship-to Address :</div>
            <div class="addr-box" id="out-addr">九龍-理大</div>
        </div>

        <div class="label-line">
            <div class="label-title">Contact Name</div>
            <div class="contact-box" id="out-contact">Ken Chan</div>
        </div>
    </div>

    <script>
        // ============================================================
        // 資料同步架構：
        // GitHub Actions（sync_lark.yml，每日 08:00/20:00 HKT + 可手動）
        // 用 Lark API 全量拉取 Outbound Record → lark_shipment_data.json；
        // 本頁經 GitHub Pages 同源讀取，無 CORS 問題。
        // App Secret 收喺 GitHub Secrets，唔會出現喺網頁。
        // 欄位對應：Doc Number=HKSLI no、Customer Name=Customer Name、
        //           Ship-to Address=Location、Contact Name=Contact Name
        // ============================================================
        const DATA_URL = 'lark_shipment_data.json';

        // 內嵌快照（後備：直接開檔案或離線時用）
        const LARK_EMBEDDED_DATA = [{"docNumber": "HKLSI25120014", "customerName": "Oscar Bioenergy Joint Venture", "shipToAddress": "新界-小蠔灣", "contactName": "Hagan Ho", "status": ""}, {"docNumber": "HKLSI25120015", "customerName": "Hong Kong Community College", "shipToAddress": "九龍-油塘", "contactName": "游先生 Mr Kelvin Yau", "status": ""}, {"docNumber": "HKLSI25120016", "customerName": "Nin Jiom Medicine Mfy. (Hong Kong) Limited", "shipToAddress": "新界-元朗", "contactName": "Grace Lam", "status": ""}];

        let lookupTimer = null;

        // ---------- 本地資料集（伺服器 JSON → localStorage 快取 → 內嵌快照） ----------
        function getDataset() {
            let data = [];
            try {
                const saved = localStorage.getItem('lark_shipment_data');
                if (saved) data = JSON.parse(saved) || [];
            } catch (e) { console.error('讀取快取失敗:', e); }
            if (!data.length && typeof LARK_EMBEDDED_DATA !== 'undefined' && LARK_EMBEDDED_DATA.length) {
                data = LARK_EMBEDDED_DATA;
            }
            // 過濾無效記錄
            return data.filter(r => r && r.docNumber);
        }

        function setStatus(msg, cls) {
            const el = document.getElementById('sync-status');
            el.textContent = msg || '';
            el.className = 'status-line' + (cls ? ' ' + cls : '');
        }

        function fillFromRecord(rec) {
            if (rec.customerName) document.getElementById('in-name').value = rec.customerName;
            if (rec.shipToAddress) document.getElementById('in-addr').value = rec.shipToAddress;
            if (rec.contactName) document.getElementById('in-contact').value = rec.contactName;
            updateLabel();
        }

        // ---------- 打 Doc Number 即時查詢（本地資料集，不分大小寫） ----------
        function onDocInput() {
            clearTimeout(lookupTimer);
            lookupTimer = setTimeout(lookupNow, 450);
        }

        // HKSLI/HKLSI 拼寫容錯：Base 實際用 HKLSI，照顧打 HKSLI 嘅人
        function normDoc(s) { return (s || '').toUpperCase().replace(/HKSLI/g, 'HKLSI'); }

        function lookupNow() {
            const docNo = document.getElementById('in-doc').value.trim();
            if (!docNo) { setStatus(''); return; }
            const key = docNo.toUpperCase();
            const data = getDataset();
            let hit = data.find(r => (r.docNumber || '').toUpperCase() === key);
            let autoFixed = false;
            if (!hit) {
                const nkey = normDoc(key);
                hit = data.find(r => normDoc(r.docNumber) === nkey);
                autoFixed = !!hit;
            }
            if (hit) {
                fillFromRecord(hit);
                const note = autoFixed ? `（已自動對應 ${hit.docNumber}）` : '';
                setStatus(`✓ 已找到 ${hit.docNumber}${note}（共 ${data.length} 筆）`, 'ok');
            } else {
                setStatus(`找不到 ${docNo}，可按「同步查詢」重新拉取最新資料`, 'warn');
            }
            updateLabel();
        }

        // ---------- 從 GitHub Pages 拉取 Actions 同步嘅最新資料 ----------
        async function refreshFromServer(manual) {
            const btn = document.getElementById('syncBtn');
            if (manual) { btn.innerText = '同步中...'; btn.disabled = true; }
            try {
                const resp = await fetch(DATA_URL + '?t=' + Date.now());
                if (!resp.ok) throw new Error('讀取失敗');
                const data = await resp.json();
                const valid = data.filter(r => r && r.docNumber);
                localStorage.setItem('lark_shipment_data', JSON.stringify(data));
                const note = '（GitHub Actions 每日 08:00／20:00 HKT 自動同步，可手動 Run workflow 即時更新）';
                if (manual) setStatus(`✓ 已同步最新資料：${valid.length} 筆有效記錄${note}`, 'ok');
                else if (valid.length) setStatus(`資料就緒：${valid.length} 筆${note}`, 'ok');
                lookupNow();
            } catch (e) {
                const data = getDataset();
                if (manual) setStatus('同步失敗，已用本機快照', 'warn');
                else if (data.length) setStatus(`本機快照：${data.length} 筆（經網站開啟可自動同步最新）`, 'warn');
                lookupNow();
            } finally {
                if (manual) { btn.innerText = '同步查詢'; btn.disabled = false; }
            }
        }

        // ==========================================
        // 標籤渲染與列印
        // ==========================================
        function updateLabel() {
            const name = document.getElementById('in-name').value || "-";
            const docNo = document.getElementById('in-doc').value || "HKLSI26050656";
            const addr = document.getElementById('in-addr').value || "九龍-理大";
            const contact = document.getElementById('in-contact').value || "Ken Chan";

            document.getElementById('out-name').innerText = name;
            document.getElementById('out-doc').innerText = docNo;
            document.getElementById('out-addr').innerText = addr;
            document.getElementById('out-contact').innerText = contact;

            JsBarcode("#barcode", docNo, {
                format: "CODE128",
                width: 2,
                height: 60,
                displayValue: false,
                margin: 0
            });
        }

        function generateAndPrint() {
            updateLabel();
            setTimeout(() => window.print(), 200);
        }

        // 頁面載入：靜默拉取最新資料
        window.addEventListener('load', () => {
            refreshFromServer(false);
            updateLabel();
        });
    </script>
</body>
</html>
