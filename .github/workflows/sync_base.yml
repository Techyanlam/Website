name: Sync Feishu Base Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [feishu_record_updated, update_to_feishu]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 加入這一步安裝 requests 套件
      - name: Install dependencies
        run: |
          pip install requests

      - name: Update or Sync to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 scripts/update_feishu.py
          python3 scripts/sync_base.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base_data.json newvision-print-tool.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-sync from Feishu update"
            git push origin main
          fi
