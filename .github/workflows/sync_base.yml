name: Sync Feishu Base Data

on:
  workflow_dispatch:           # 支援手動觸發
  repository_dispatch:         # 支援飛書 Webhook 外部觸發
    types: [feishu_record_updated]
  schedule:
    - cron: '0 2 * * *'        # 每日備份定時排程

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync data
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 scripts/sync_base.py

     - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base_data.json newvision-print-tool.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            # 將原本的 "Auto-sync from Feishu update [skip ci]" 改為以下內容（去掉 [skip ci]）：
            git commit -m "Auto-sync from Feishu update"
            git push origin main
          fi
