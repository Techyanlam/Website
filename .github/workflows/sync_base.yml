name: Sync Feishu Base Data

on:
  workflow_dispatch:
  # 加入 repository_dispatch，並移除 types 限制，讓所有 dispatches 事件都能觸發
  repository_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync data
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 scripts/sync_base.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base_data.json newvision-print-tool.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-sync from Feishu update"
            git push origin main
          fi
