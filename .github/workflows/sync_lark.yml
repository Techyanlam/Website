name: Sync Lark Base Data

# Lark Base → lark_shipment_data.json 全量同步
# 觸發方式：
#   ① Lark Base 自動化 webhook（repository_dispatch，真・事件驅動）
#   ② 每 5 分鐘定時（後備）
#   ③ 手動 Run workflow

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [lark-base-update]
  workflow_dispatch:

# 撞車時只保留最新一次（全量同步，舊 run 冇必要跑埋）
concurrency:
  group: sync-lark
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync data
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: python3 scripts/sync_lark.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto sync Lark Base data"
          git push
