name: Update Feishu Record

on:
  repository_dispatch:
    types: [update_to_feishu]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update Feishu record
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python3 scripts/update_feishu.py

      - name: Sync back to base_data.json
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 scripts/sync_base.py

      - name: Commit sync result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base_data.json
          git diff --staged --quiet || git commit -m "Auto-sync from Feishu update [skip ci]"
          git push origin main
