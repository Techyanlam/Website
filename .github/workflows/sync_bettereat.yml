name: Sync BETTEREAT sold data
on:
  schedule:
    - cron: "45 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sold records from Feishu Base
        env:
          FEISHU_APP_ID: ${{ secrets.BETTEREAT_FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.BETTEREAT_FEISHU_APP_SECRET }}
        run: python3 scripts/sync_bettereat.py
      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bettereat_sold_data.json
          git diff --cached --quiet || git commit -m "BETTEREAT sold data sync"
          git push
